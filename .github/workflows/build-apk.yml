name: Build Android APK (Multi-Role Portal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-Role APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd1fe5892186497b66524c942834\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android Project
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/assets
          npm run cap:sync || npx @capacitor/cli copy android || echo "Sync completed with existing assets"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_build.log

      - name: Report Build Output
        if: always()
        run: |
          echo "### Gradle Build Log Tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY || echo "No log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Locate Generated APK Files
        run: |
          echo "### All APK Files Found" >> $GITHUB_STEP_SUMMARY
          find . -type f -name "*.apk" | tee -a $GITHUB_STEP_SUMMARY || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cargo-Logistics-Pro-MultiRole-APK
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 30
