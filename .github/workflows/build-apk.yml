name: Build Android APK (Multi-Role Portal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-Role APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd1fe5892186497b66524c942834\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          fi

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android Project
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/assets
          npm run cap:sync || npx @capacitor/cli copy android || echo "Sync completed with existing assets"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_build.log

      - name: Push Build Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f gradle_build.log
          git commit -m "build log from run $GITHUB_RUN_NUMBER" || true
          git push -f origin build-logs || true

      - name: Locate and Stage APK
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/ \;
          echo "### All APK Files Found" >> $GITHUB_STEP_SUMMARY
          ls -la apk_output/ | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cargo-Logistics-Pro-MultiRole-APK
          path: apk_output/
          if-no-files-found: warn
          retention-days: 30
