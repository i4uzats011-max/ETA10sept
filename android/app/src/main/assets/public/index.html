<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cargo Logistics Pro</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px 0; }
    p { font-size: 0.875rem; color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Cargo Logistics Pro</h2>
  <p>Connecting to portal services...</p>
  <script>
    const DEFAULT_PORTAL_URL = 'https://eta-usi.vercel.app';
    const targetUrl = localStorage.getItem('CUSTOM_PORTAL_URL') || DEFAULT_PORTAL_URL;

    // Immediately redirect to production portal
    try {
      window.location.replace(targetUrl);
    } catch (e) {
      window.location.href = targetUrl;
    }

    // Safety timeout fallback: if redirect is taking time or offline, retry
    setTimeout(() => {
      if (window.location.href.indexOf('http') === -1 || window.location.href.indexOf('eta-usi') === -1) {
        window.location.href = targetUrl;
      }
    }, 1500);
  </script>
</body>
</html>
