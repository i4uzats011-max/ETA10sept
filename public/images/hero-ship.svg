<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  
  <!-- Background Sky -->
  <rect width="800" height="350" fill="url(#skyGrad)"/>
  
  <!-- Stars / Nodes -->
  <circle cx="100" cy="60" r="2" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="250" cy="90" r="1.5" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="500" cy="50" r="2" fill="#F8FAFC" opacity="0.5"/>
  <circle cx="700" cy="80" r="2" fill="#F8FAFC" opacity="0.7"/>
  
  <!-- Route Line Overlay -->
  <path d="M 120 180 Q 400 100 680 180" stroke="#EF4444" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity="0.7"/>
  <circle cx="120" cy="180" r="6" fill="#EF4444"/>
  <circle cx="680" cy="180" r="6" fill="#3B82F6"/>
  
  <!-- Ocean Water -->
  <rect y="320" width="800" height="180" fill="url(#oceanGrad)"/>
  <path d="M 0 320 Q 200 310 400 320 T 800 320 L 800 500 L 0 500 Z" fill="#0284C7" opacity="0.5"/>

  <!-- Cargo Containers stacked on ship -->
  <!-- Layer 1 (Bottom Containers) -->
  <rect x="220" y="220" width="70" height="35" fill="#3B82F6" rx="3" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="295" y="220" width="70" height="35" fill="#EF4444" rx="3" stroke="#B91C1C" stroke-width="1.5"/>
  <rect x="370" y="220" width="70" height="35" fill="#F59E0B" rx="3" stroke="#D97706" stroke-width="1.5"/>
  <rect x="445" y="220" width="70" height="35" fill="#10B981" rx="3" stroke="#047857" stroke-width="1.5"/>
  <rect x="520" y="220" width="70" height="35" fill="#3B82F6" rx="3" stroke="#1D4ED8" stroke-width="1.5"/>

  <!-- Layer 2 (Middle Containers) -->
  <rect x="255" y="180" width="70" height="35" fill="#10B981" rx="3" stroke="#047857" stroke-width="1.5"/>
  <rect x="330" y="180" width="70" height="35" fill="#3B82F6" rx="3" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="405" y="180" width="70" height="35" fill="#EF4444" rx="3" stroke="#B91C1C" stroke-width="1.5"/>
  <rect x="480" y="180" width="70" height="35" fill="#F59E0B" rx="3" stroke="#D97706" stroke-width="1.5"/>

  <!-- Layer 3 (Top Containers) -->
  <rect x="295" y="140" width="70" height="35" fill="#EF4444" rx="3" stroke="#B91C1C" stroke-width="1.5"/>
  <rect x="370" y="140" width="70" height="35" fill="#10B981" rx="3" stroke="#047857" stroke-width="1.5"/>
  <rect x="445" y="140" width="70" height="35" fill="#3B82F6" rx="3" stroke="#1D4ED8" stroke-width="1.5"/>

  <!-- Ship Cabin / Bridge -->
  <rect x="600" y="150" width="60" height="100" fill="#F8FAFC" rx="4"/>
  <rect x="610" y="165" width="40" height="15" fill="#38BDF8" rx="2"/>
  <rect x="610" y="195" width="40" height="15" fill="#38BDF8" rx="2"/>
  <rect x="625" y="110" width="10" height="40" fill="#EF4444"/>

  <!-- Ship Hull -->
  <path d="M 140 255 L 680 255 L 620 340 L 220 340 Z" fill="url(#hullGrad)"/>
  <rect x="140" y="250" width="540" height="8" fill="#F8FAFC"/>
  
  <!-- Ship Bow Wave -->
  <path d="M 120 340 Q 180 325 240 340" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8"/>
  <text x="320" y="300" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="3">CHINA → INDIA LOGISTICS</text>
</svg>
