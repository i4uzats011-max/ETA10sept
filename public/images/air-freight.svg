<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="airBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#airBg)"/>
  
  <!-- Cloud shapes in background -->
  <path d="M 50 150 Q 70 120 100 130 Q 130 110 160 130 Q 190 120 210 150 Z" fill="#334155" opacity="0.4"/>
  <path d="M 380 250 Q 400 220 430 230 Q 460 210 490 230 Q 520 220 540 250 Z" fill="#334155" opacity="0.3"/>

  <!-- Motion Trails -->
  <path d="M 50 220 L 250 200" stroke="#EF4444" stroke-width="4" stroke-dasharray="6 6" opacity="0.8"/>
  <path d="M 80 240 L 280 220" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Cargo Airplane Silhouette -->
  <g transform="translate(180, 80)">
    <!-- Wings -->
    <path d="M 120 110 L 220 20 L 260 20 L 170 110 Z" fill="#94A3B8"/>
    <!-- Main Fuselage -->
    <path d="M 40 120 Q 80 90 260 90 Q 340 90 380 120 Q 340 140 220 140 Q 80 140 40 120 Z" fill="url(#planeGrad)"/>
    <!-- Tail Fin -->
    <path d="M 70 110 L 20 40 L 60 40 L 110 110 Z" fill="#EF4444"/>
    <!-- Windows & Cargo Door -->
    <rect x="220" y="105" width="40" height="20" fill="#0284C7" rx="3"/>
    <circle cx="280" cy="115" r="4" fill="#0284C7"/>
    <circle cx="300" cy="115" r="4" fill="#0284C7"/>
    <circle cx="320" cy="115" r="4" fill="#0284C7"/>
    <!-- Jet Engine -->
    <rect x="180" y="130" width="45" height="20" fill="#475569" rx="6"/>
  </g>

  <!-- Cargo Box Graphic -->
  <g transform="translate(380, 260)">
    <rect x="0" y="0" width="80" height="70" fill="#D97706" rx="6"/>
    <path d="M 0 0 L 40 20 L 80 0 L 40 -20 Z" fill="#F59E0B"/>
    <rect x="35" y="0" width="10" height="70" fill="#B45309"/>
    <text x="15" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">AIR</text>
  </g>
</svg>
