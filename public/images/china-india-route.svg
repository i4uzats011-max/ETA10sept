<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#mapBg)"/>

  <!-- Grid Pattern -->
  <path d="M 0 50 L 800 50 M 0 150 L 800 150 M 0 250 L 800 250 M 0 350 L 800 350" stroke="#1E293B" stroke-width="1"/>
  <path d="M 100 0 L 100 450 M 300 0 L 300 450 M 500 0 L 500 450 M 700 0 L 700 450" stroke="#1E293B" stroke-width="1"/>

  <!-- Route Line China (Ningbo/Shanghai/Shenzhen) to India (Nhava Sheva/Mundra/Delhi) -->
  <path d="M 620 180 Q 420 320 220 220" stroke="#EF4444" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" fill="none"/>
  
  <!-- China Origin Hub -->
  <g transform="translate(620, 180)">
    <circle cx="0" cy="0" r="18" fill="#EF4444" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="#EF4444"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <text x="18" y="5" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#F8FAFC">CHINA (Ningbo / Shenzhen / Shanghai)</text>
  </g>

  <!-- Transit Vessel Icon on Route -->
  <g transform="translate(420, 240)">
    <rect x="-25" y="-12" width="50" height="24" fill="#F59E0B" rx="12"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" text-anchor="middle">TRANSIT</text>
  </g>

  <!-- India Destination Hub -->
  <g transform="translate(220, 220)">
    <circle cx="0" cy="0" r="18" fill="#3B82F6" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="#3B82F6"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <text x="-210" y="5" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#F8FAFC">INDIA (Delhi / Nhava Sheva / Mundra)</text>
  </g>

  <rect x="250" y="370" width="300" height="40" fill="#EF4444" rx="20"/>
  <text x="400" y="395" font-family="Arial, sans-serif" font-weight="black" font-size="14" fill="#FFFFFF" text-anchor="middle">EXCLUSIVE CHINA-INDIA SHIPPING ROUTE</text>
</svg>
