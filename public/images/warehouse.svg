<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="whBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#whBg)"/>
  
  <!-- Warehouse Structure -->
  <path d="M 80 160 L 300 70 L 520 160 L 520 340 L 80 340 Z" fill="#047857"/>
  <path d="M 80 160 L 300 70 L 520 160 Z" fill="#059669"/>
  
  <!-- Roller Shutter Door -->
  <rect x="220" y="200" width="160" height="140" fill="#0F766E"/>
  <line x1="220" y1="230" x2="380" y2="230" stroke="#14B8A6" stroke-width="3"/>
  <line x1="220" y1="260" x2="380" y2="260" stroke="#14B8A6" stroke-width="3"/>
  <line x1="220" y1="290" x2="380" y2="290" stroke="#14B8A6" stroke-width="3"/>
  <line x1="220" y1="320" x2="380" y2="320" stroke="#14B8A6" stroke-width="3"/>

  <!-- Forklift Silhouette -->
  <g transform="translate(110, 260)">
    <rect x="0" y="20" width="60" height="40" fill="#F59E0B" rx="4"/>
    <circle cx="15" cy="60" r="12" fill="#1F2937"/>
    <circle cx="50" cy="60" r="12" fill="#1F2937"/>
    <rect x="65" y="-10" width="8" height="70" fill="#4B5563"/>
    <rect x="73" y="30" width="20" height="6" fill="#9CA3AF"/>
  </g>

  <!-- Title Badge -->
  <rect x="150" y="330" width="300" height="40" fill="#10B981" rx="20"/>
  <text x="300" y="355" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle">SECURE WAREHOUSING & STORAGE</text>
</svg>
